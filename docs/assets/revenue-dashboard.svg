<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Monthly revenue dashboard rendered with panel-mosaic</title>
  <desc id="desc">A colorful stacked bar chart of monthly revenue by region, with summary metrics.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#f7f7fb"/>
  <rect x="40" y="36" width="1200" height="156" rx="24" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="84" y="88" fill="#ddd6fe" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PANEL-MOSAIC + DUCKDB</text>
  <text x="84" y="137" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Monthly revenue at a glance</text>
  <text x="84" y="166" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="18">Interactive data exploration with browser-side SQL queries.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="222" width="258" height="96" rx="18" fill="#e9e4ff"/>
    <text x="64" y="254" fill="#6d28d9" font-size="14" font-weight="700">TOTAL REVENUE</text>
    <text x="64" y="296" fill="#1e1b4b" font-size="34" font-weight="700">$2.18M</text>
    <rect x="316" y="222" width="258" height="96" rx="18" fill="#d9f7ef"/>
    <text x="340" y="254" fill="#047857" font-size="14" font-weight="700">BEST MONTH</text>
    <text x="340" y="296" fill="#064e3b" font-size="34" font-weight="700">October</text>
    <rect x="592" y="222" width="258" height="96" rx="18" fill="#ffe5ef"/>
    <text x="616" y="254" fill="#db2777" font-size="14" font-weight="700">REGIONS</text>
    <text x="616" y="296" fill="#831843" font-size="34" font-weight="700">3</text>
    <rect x="868" y="222" width="372" height="96" rx="18" fill="#e5f0ff"/>
    <text x="892" y="254" fill="#2563eb" font-size="14" font-weight="700">QUERY ENGINE</text>
    <text x="892" y="296" fill="#172554" font-size="28" font-weight="700">DuckDB</text>
  </g>
  <rect x="40" y="342" width="1200" height="338" rx="24" fill="white" filter="url(#shadow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="390" fill="#17152f" font-size="22" font-weight="700">Revenue by month and region</text>
    <text x="78" y="418" fill="#66627d" font-size="15">Hover, filter, and link this chart with the rest of your Mosaic dashboard.</text>
    <circle cx="934" cy="387" r="7" fill="#7c3aed"/><text x="948" y="392" fill="#4c4764" font-size="14">North</text>
    <circle cx="1020" cy="387" r="7" fill="#f59e0b"/><text x="1034" y="392" fill="#4c4764" font-size="14">Central</text>
    <circle cx="1122" cy="387" r="7" fill="#ec4899"/><text x="1136" y="392" fill="#4c4764" font-size="14">South</text>
    <g stroke="#e7e5f0" stroke-width="1">
      <line x1="100" y1="610" x2="1180" y2="610"/><line x1="100" y1="565" x2="1180" y2="565"/><line x1="100" y1="520" x2="1180" y2="520"/><line x1="100" y1="475" x2="1180" y2="475"/>
    </g>
    <g fill="#7c7890" font-size="12"><text x="66" y="614">0</text><text x="52" y="569">50k</text><text x="45" y="524">100k</text><text x="45" y="479">150k</text></g>
    <g>
      <rect x="142" y="565" width="48" height="45" rx="5" fill="#7c3aed"/><rect x="142" y="528" width="48" height="37" rx="5" fill="#f59e0b"/><rect x="142" y="490" width="48" height="38" rx="5" fill="#ec4899"/>
      <rect x="230" y="558" width="48" height="52" rx="5" fill="#7c3aed"/><rect x="230" y="515" width="48" height="43" rx="5" fill="#f59e0b"/><rect x="230" y="470" width="48" height="45" rx="5" fill="#ec4899"/>
      <rect x="318" y="568" width="48" height="42" rx="5" fill="#7c3aed"/><rect x="318" y="530" width="48" height="38" rx="5" fill="#f59e0b"/><rect x="318" y="488" width="48" height="42" rx="5" fill="#ec4899"/>
      <rect x="406" y="552" width="48" height="58" rx="5" fill="#7c3aed"/><rect x="406" y="506" width="48" height="46" rx="5" fill="#f59e0b"/><rect x="406" y="456" width="48" height="50" rx="5" fill="#ec4899"/>
      <rect x="494" y="548" width="48" height="62" rx="5" fill="#7c3aed"/><rect x="494" y="499" width="48" height="49" rx="5" fill="#f59e0b"/><rect x="494" y="445" width="48" height="54" rx="5" fill="#ec4899"/>
      <rect x="582" y="555" width="48" height="55" rx="5" fill="#7c3aed"/><rect x="582" y="510" width="48" height="45" rx="5" fill="#f59e0b"/><rect x="582" y="463" width="48" height="47" rx="5" fill="#ec4899"/>
      <rect x="670" y="538" width="48" height="72" rx="5" fill="#7c3aed"/><rect x="670" y="485" width="48" height="53" rx="5" fill="#f59e0b"/><rect x="670" y="427" width="48" height="58" rx="5" fill="#ec4899"/>
      <rect x="758" y="544" width="48" height="66" rx="5" fill="#7c3aed"/><rect x="758" y="493" width="48" height="51" rx="5" fill="#f59e0b"/><rect x="758" y="439" width="48" height="54" rx="5" fill="#ec4899"/>
      <rect x="846" y="531" width="48" height="79" rx="5" fill="#7c3aed"/><rect x="846" y="471" width="48" height="60" rx="5" fill="#f59e0b"/><rect x="846" y="407" width="48" height="64" rx="5" fill="#ec4899"/>
      <rect x="934" y="521" width="48" height="89" rx="5" fill="#7c3aed"/><rect x="934" y="452" width="48" height="69" rx="5" fill="#f59e0b"/><rect x="934" y="382" width="48" height="70" rx="5" fill="#ec4899"/>
      <rect x="1022" y="536" width="48" height="74" rx="5" fill="#7c3aed"/><rect x="1022" y="478" width="48" height="58" rx="5" fill="#f59e0b"/><rect x="1022" y="418" width="48" height="60" rx="5" fill="#ec4899"/>
      <rect x="1110" y="525" width="48" height="85" rx="5" fill="#7c3aed"/><rect x="1110" y="459" width="48" height="66" rx="5" fill="#f59e0b"/><rect x="1110" y="390" width="48" height="69" rx="5" fill="#ec4899"/>
    </g>
    <g fill="#656178" font-size="12" text-anchor="middle"><text x="166" y="640">Jan</text><text x="254" y="640">Feb</text><text x="342" y="640">Mar</text><text x="430" y="640">Apr</text><text x="518" y="640">May</text><text x="606" y="640">Jun</text><text x="694" y="640">Jul</text><text x="782" y="640">Aug</text><text x="870" y="640">Sep</text><text x="958" y="640">Oct</text><text x="1046" y="640">Nov</text><text x="1134" y="640">Dec</text></g>
  </g>
</svg>
